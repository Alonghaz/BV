name: Build BV APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write google-services.json (optional)
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$DATA" ]; then
            printf '%s' "$DATA" > app/google-services.json
            echo "google-services.json 已写入"
          else
            echo "未设置 GOOGLE_SERVICES_JSON，跳过"
          fi

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDefaultDebug assembleDefaultAlpha

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BV-debug-apk
          path: app/build/outputs/apk/default/debug/*.apk
          if-no-files-found: error

      - name: Upload alpha APK
        uses: actions/upload-artifact@v4
        with:
          name: BV-alpha-apk
          path: app/build/outputs/apk/default/alpha/*.apk
          if-no-files-found: error
