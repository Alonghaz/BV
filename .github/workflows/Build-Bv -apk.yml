name: Build BV APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Write google-services.json
        env:
          DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: |
          echo "$DATA" > app/google-services.json

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDefaultDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BV-debug-apk
          path: app/build/outputs/apk/default/debug/*.apk

      - name: Build alpha APK
        run: ./gradlew assembleDefaultAlpha

      - name: Upload alpha APK
        uses: actions/upload-artifact@v4
        with:
          name: BV-alpha-apk
          path: app/build/outputs/apk/default/alpha/*.apk

